<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-5">
    <h1>Update student</h1>

    <form action="{{ url_for('update_student', id=student[0]) }}" method="post" class="row g-3 mb-4">
        <label><h5>Name:</h5></label>
        <input type="text" name="name" class="form-contol" value="{{ student[1] }}" required>
        <br><br>

        <label><h5>Age:</h5></label>
        <input type="number" name="age" class="form-contol" value="{{ student[2] }}" required>
        <br><br>

        <label><h5>Grade:</h5></label>
        <input type="text" name="grade" class="form-contol" value="{{ student[3] }}" required>
        <br><br>

        <button type="submit" class="btn btn-success w-100">Update Student</button>
    </form>
    <br>
    <a href="{{ url_for('index') }}" class="btn btn-sm btn-danger">Back To Students</a>
</body>
</html>
